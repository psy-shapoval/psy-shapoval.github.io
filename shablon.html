<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Шаблон файлу клієнта</title>
<!--
  ЯК ЗМІНИТИ ПОСИЛАННЯ НА ШАБЛОН:
  замініть адресу в ТРЬОХ місцях нижче — у meta refresh, у скрипті (const URL) і в посиланні <a href>.
-->
<meta http-equiv="refresh" content="0; url=https://docs.google.com/spreadsheets/d/1ZBehDQBJRFhmteHzBB_TzZK5QA25IagiCbKxdl6BeVY/edit?usp=sharing">
<script>
  const URL = "https://docs.google.com/spreadsheets/d/1ZBehDQBJRFhmteHzBB_TzZK5QA25IagiCbKxdl6BeVY/edit?usp=sharing";
  location.replace(URL);
</script>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        font-family:Arial, sans-serif; background:#F7F5F2; color:#46585C; padding:16px; box-sizing:border-box; text-align:center; }
  a{ color:#1F9E8F; }
</style>
</head>
<body>
  <p>Відкриваю шаблон файлу клієнта…<br>
  Якщо нічого не відбулося — <a href="https://docs.google.com/spreadsheets/d/1ZBehDQBJRFhmteHzBB_TzZK5QA25IagiCbKxdl6BeVY/edit?usp=sharing">натисніть тут</a>.</p>
</body>
</html>
